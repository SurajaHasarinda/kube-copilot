apiVersion: v1
kind: Secret
metadata:
  name: kube-copilot-secret
  namespace: kube-copilot
type: Opaque
stringData:
  GOOGLE_API_KEY: "${GOOGLE_API_KEY}"
  JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
  ADMIN_USERNAME: "${ADMIN_USERNAME}"
  ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
  POSTGRES_URL: "${POSTGRES_URL}"
