apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-copilot
  namespace: kube-copilot
  labels:
    app: kube-copilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-copilot
  template:
    metadata:
      labels:
        app: kube-copilot
    spec:
      serviceAccountName: kube-copilot-sa
      containers:
      - name: kube-copilot-app
        image: surajadev/kube-copilot:latest
        ports:
        - containerPort: 8321
        resources:
          requests:
            memory: "256Mi"
            cpu: "125m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        envFrom:
        - configMapRef:
            name: kube-copilot-config
        env:
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: kube-copilot-secret
              key: GOOGLE_API_KEY
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: kube-copilot-secret
              key: JWT_SECRET_KEY
        - name: ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: kube-copilot-secret
              key: ADMIN_USERNAME
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kube-copilot-secret
              key: ADMIN_PASSWORD
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: kube-copilot-secret
              key: POSTGRES_URL
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        livenessProbe:
          httpGet:
            path: /health
            port: 8321
          initialDelaySeconds: 40
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8321
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: data-volume
        hostPath:
          path: /opt/kube-copilot/data
          type: DirectoryOrCreate
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-copilot-sa
  namespace: kube-copilot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-copilot-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: kube-copilot-sa
  namespace: kube-copilot
