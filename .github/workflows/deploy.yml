name: Deploy to K3s

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:

env:
  K3S_HOST: ${{ secrets.K3S_TAILSCALE_IP }}
  K3S_USER: ${{ secrets.K3S_USER }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-deployer

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.K3S_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Substitute secrets into K8s manifests
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: |
          envsubst < k8s/secret.yml > k8s/secret-rendered.yml

      - name: Copy manifests to K3s node
        run: |
          scp k8s/namespace.yml ${{ env.K3S_USER }}@${{ env.K3S_HOST }}:/tmp/kc-namespace.yml
          scp k8s/secret-rendered.yml ${{ env.K3S_USER }}@${{ env.K3S_HOST }}:/tmp/kc-secret.yml
          scp k8s/configmap.yml ${{ env.K3S_USER }}@${{ env.K3S_HOST }}:/tmp/kc-configmap.yml
          scp k8s/deployment.yml ${{ env.K3S_USER }}@${{ env.K3S_HOST }}:/tmp/kc-deployment.yml
          scp k8s/service.yml ${{ env.K3S_USER }}@${{ env.K3S_HOST }}:/tmp/kc-service.yml

      - name: Deploy to K3s
        run: |
          ssh ${{ env.K3S_USER }}@${{ env.K3S_HOST }} << 'EOF'
            sudo k3s kubectl apply -f /tmp/kc-namespace.yml
            sudo k3s kubectl apply -f /tmp/kc-configmap.yml
            sudo k3s kubectl apply -f /tmp/kc-secret.yml
            sudo k3s kubectl apply -f /tmp/kc-deployment.yml
            sudo k3s kubectl apply -f /tmp/kc-service.yml

            # Force pull the latest images
            sudo k3s kubectl rollout restart deployment/kube-copilot -n kube-copilot

            # Wait for rollouts to complete
            sudo k3s kubectl rollout status deployment/kube-copilot -n kube-copilot --timeout=120s

            # Cleanup temp files
            rm -f /tmp/kc-namespace.yml /tmp/kc-configmap.yml /tmp/kc-secret.yml /tmp/kc-deployment.yml /tmp/kc-service.yml
          EOF
