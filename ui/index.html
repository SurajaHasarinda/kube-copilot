<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KubeCopilot</title>
  <!-- Add an SVG icon here if available -->
  <link rel="icon" type="image/svg+xml" href="/kube-copilot.svg" />
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    // Setup Tailwind theme configuration 
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#7484FC', // SVG logo color
            success: '#28A745',
            warning: '#FFC107',
            danger: '#DC3545',
            // Add other custom palette options to replace generically generated styles
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');

    body {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      background-color: #0f172a;
      color: #f8fafc;
    }

    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 10px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Micro-Animations configuration */
    @keyframes slide-up {
      from {
        transform: translateY(100%);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .animate-slide-up {
      animation: slide-up 0.3s ease-out;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
